name: Deploy

# Spec 0002, ADR 0007. Started manually on `main` by the owner. build → staging (infra,
# migrations, staging slot, verification) → production (owner approval in the `production`
# environment, then swap). The owner reviews staging before approving.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = infra, migrations, staging, verify, swap. infra-only = first deployment before the database bootstrap.'
        type: choice
        options: [full, infra-only]
        default: full

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Spec 0002 D1: only commits whose CI succeeded are deployed. Waits for checks that are
      # still running (for example when the deploy is started right after a merge).
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for check in verify infra; do
            for attempt in $(seq 1 90); do
              state=$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs?check_name=$check"                 -q '.check_runs[0] | "\(.status // "missing") \(.conclusion // "none")"')
              read -r status conclusion <<<"$state"
              if [ "$status" = "completed" ]; then
                break
              fi
              echo "CI check '$check' is $status; waiting ($attempt/90)"
              sleep 10
            done
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              echo "::error::CI check '$check' for $SHA: status=$status, conclusion=$conclusion. Deploy only commits with green CI."
              exit 1
            fi
            echo "CI check '$check' succeeded"
          done

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Spec 0002 D3: build once; the same artifact goes to staging and is swapped to production.
      - name: Build standalone bundle
        run: |
          set -euo pipefail
          npm run build
          node scripts/prepare-standalone.mjs
          (cd .next/standalone && zip -qr "$GITHUB_WORKSPACE/app.zip" .)
        env:
          DEPLOYMENT_ID: ${{ github.sha }}

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ github.sha }}
          path: app.zip
          retention-days: 7

  # Infrastructure, migrations and the staging slot. Runs without a reviewer: only the owner can
  # start this workflow, and only on main with green CI. Production is untouched until the swap.
  staging:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # OIDC subject environment:staging (infra/bootstrap).
    environment:
      name: staging
      url: ${{ steps.infra.outputs.staging_url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      web_app: ${{ steps.infra.outputs.web_app }}
      staging_host: ${{ steps.infra.outputs.staging_host }}
      production_host: ${{ steps.infra.outputs.production_host }}
    env:
      RESOURCE_GROUP: rg-longrun
      SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      FULL: ${{ inputs.mode == 'full' }}
      # Identifiers, not credentials. Stored as environment secrets only so the logs of a public
      # repository mask them (ADR 0007, spec 0002 D9). Passed to shell steps through env, never
      # inlined into run scripts.
      POSTGRES_ADMIN_OBJECT_ID: ${{ secrets.POSTGRES_ADMIN_OBJECT_ID }}
      POSTGRES_ADMIN_NAME: ${{ secrets.POSTGRES_ADMIN_NAME }}
      AUTH_CLIENT_ID_PRODUCTION: ${{ secrets.AUTH_CLIENT_ID_PRODUCTION }}
      AUTH_CLIENT_ID_STAGING: ${{ secrets.AUTH_CLIENT_ID_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies (migration runner)
        run: npm ci

      - name: Azure login (OIDC, no credentials)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The runtime reaches production only through the swap (the Node.js version is swapped with
      # the slot). Staging gets the desired version from .node-version; production keeps what it
      # runs now. On the first deployment there is no production yet, so both get the desired one.
      - name: Resolve runtime versions
        id: runtime
        run: |
          set -euo pipefail
          major=$(cut -d. -f1 .node-version | tr -d '[:space:]')
          desired="NODE|${major}-lts"
          app=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[0].name" --output tsv)
          current=""
          if [ -n "$app" ]; then
            current=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$app" \
              --query linuxFxVersion --output tsv)
          fi
          current=${current:-$desired}
          for value in "$desired" "$current"; do
            if ! [[ "$value" =~ ^NODE\|[0-9]+-lts$ ]]; then
              echo "::error::Unexpected runtime value '$value'"
              exit 1
            fi
          done
          echo "Production runtime: $current; staging runtime: $desired"
          {
            echo "production=$current"
            echo "staging=$desired"
          } >> "$GITHUB_OUTPUT"

      - name: Preview infrastructure changes
        env:
          PRODUCTION_RUNTIME: ${{ steps.runtime.outputs.production }}
          STAGING_RUNTIME: ${{ steps.runtime.outputs.staging }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main/main.bicep \
            --parameters \
              postgresAdminObjectId="$POSTGRES_ADMIN_OBJECT_ID" \
              postgresAdminPrincipalName="$POSTGRES_ADMIN_NAME" \
              productionAuthClientId="$AUTH_CLIENT_ID_PRODUCTION" \
              stagingAuthClientId="$AUTH_CLIENT_ID_STAGING" \
              productionRuntime="$PRODUCTION_RUNTIME" \
              stagingRuntime="$STAGING_RUNTIME"

      - name: Deploy infrastructure
        id: infra
        env:
          PRODUCTION_RUNTIME: ${{ steps.runtime.outputs.production }}
          STAGING_RUNTIME: ${{ steps.runtime.outputs.staging }}
        run: |
          set -euo pipefail
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "main-$RUN_ID" \
            --template-file infra/main/main.bicep \
            --parameters \
              postgresAdminObjectId="$POSTGRES_ADMIN_OBJECT_ID" \
              postgresAdminPrincipalName="$POSTGRES_ADMIN_NAME" \
              productionAuthClientId="$AUTH_CLIENT_ID_PRODUCTION" \
              stagingAuthClientId="$AUTH_CLIENT_ID_STAGING" \
              productionRuntime="$PRODUCTION_RUNTIME" \
              stagingRuntime="$STAGING_RUNTIME" \
            --query properties.outputs --output json)
          staging_host=$(jq -r .stagingHostName.value <<<"$outputs")
          {
            echo "web_app=$(jq -r .webAppName.value <<<"$outputs")"
            echo "postgres_server=$(jq -r .postgresServerName.value <<<"$outputs")"
            echo "postgres_host=$(jq -r .postgresHost.value <<<"$outputs")"
            echo "database=$(jq -r .databaseName.value <<<"$outputs")"
            echo "staging_host=$staging_host"
            echo "staging_url=https://$staging_host"
            echo "production_host=$(jq -r .productionHostName.value <<<"$outputs")"
          } >> "$GITHUB_OUTPUT"

      # --- Migrations (ADR 0007 exception: temporary, always-removed firewall rule) ---------

      - name: Open database firewall for this runner
        id: firewall
        if: env.FULL == 'true'
        env:
          POSTGRES_SERVER: ${{ steps.infra.outputs.postgres_server }}
        run: |
          set -euo pipefail
          ip=$(curl -fsS --max-time 10 https://api.ipify.org)
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER" \
            --name "ci-migration-$RUN_ID" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Run migrations as longrun_migrator
        if: env.FULL == 'true'
        env:
          DATABASE_HOST: ${{ steps.infra.outputs.postgres_host }}
          DATABASE_NAME: ${{ steps.infra.outputs.database }}
          DATABASE_USER: longrun_migrator
          DATABASE_SSL: require
        run: |
          set -euo pipefail
          # The pipeline identity's Entra token is the password for this short-lived process.
          token=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)
          echo "::add-mask::$token"
          DATABASE_PASSWORD="$token" node scripts/migrate.ts

      - name: Close database firewall (always)
        if: always() && steps.firewall.outputs.created == 'true'
        env:
          POSTGRES_SERVER: ${{ steps.infra.outputs.postgres_server }}
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER" \
            --name "ci-migration-$RUN_ID" --yes --output none

      # --- Staging ---------------------------------------------------------------------------

      - name: Download bundle
        if: env.FULL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-${{ github.sha }}
          path: artifact

      - name: Deploy bundle to staging slot
        if: env.FULL == 'true'
        env:
          WEB_APP: ${{ steps.infra.outputs.web_app }}
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP" \
            --slot staging \
            --src-path artifact/app.zip --type zip \
            --async false --restart true

      # Spec 0002 E3: wait up to 10 minutes for staging to serve this exact build. /health is
      # anonymous (ADR 0002 amendment) and reports the build version.
      - name: Wait for staging to serve this build
        if: env.FULL == 'true'
        env:
          HOST: ${{ steps.infra.outputs.staging_host }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            version=$(curl -fsS --max-time 10 "https://$HOST/health" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$version" = "$SHA" ]; then
              echo "Staging serves $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging did not serve $SHA within 10 minutes"
          exit 1

      # Spec 0002 D7: sign-in enforced, and app + database healthy, before the owner is asked.
      - name: Verify staging
        if: env.FULL == 'true'
        env:
          HOST: ${{ steps.infra.outputs.staging_host }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          bash scripts/ci/check-signin-required.sh "$HOST" "$TENANT"
          status=$(curl -fsS --max-time 10 "https://$HOST/health" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "::error::Staging /health did not report ok"
            exit 1
          fi
          echo "Staging verified. Review https://$HOST, then approve the production job to swap."

  # Spec 0002 D4: the owner approves here, after reviewing staging. The job waits (without a
  # runner) until approved or rejected; rejecting leaves production untouched.
  production:
    needs: staging
    if: inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # OIDC subject environment:production (infra/bootstrap); the owner is required reviewer.
    environment:
      name: production
      url: https://${{ needs.staging.outputs.production_host }}
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-longrun
      SHA: ${{ github.sha }}
      WEB_APP: ${{ needs.staging.outputs.web_app }}
      STAGING_HOST: ${{ needs.staging.outputs.staging_host }}
      PRODUCTION_HOST: ${{ needs.staging.outputs.production_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The approval may come much later; swap only if staging still serves the reviewed build.
      - name: Check staging still serves this build
        run: |
          set -euo pipefail
          version=$(curl -fsS --max-time 10 "https://$STAGING_HOST/health" | jq -r '.version // empty')
          if [ "$version" != "$SHA" ]; then
            echo "::error::Staging serves '$version', not the reviewed $SHA. Start a new deploy."
            exit 1
          fi

      - name: Azure login (OIDC, no credentials)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service warms up /health on the staging slot and stops the swap unless it returns 200.
      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP" \
            --slot staging --target-slot production

      - name: Verify production
        env:
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          bash scripts/ci/check-signin-required.sh "$PRODUCTION_HOST" "$TENANT"
          for attempt in $(seq 1 12); do
            version=$(curl -fsS --max-time 10 "https://$PRODUCTION_HOST/health" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$version" = "$SHA" ]; then
              echo "Production serves $SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production serves '$version' after the swap, expected $SHA"
          exit 1
