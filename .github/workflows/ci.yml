name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Spec 0003 / ADR 0001: fail on known high or critical vulnerabilities in what ships.
      # Advisories change over time, so main can turn red without a code change; that is the point.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify registry signatures and attestations
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, component and integration tests with coverage thresholds
        run: npm run test:coverage

      # Spec 0004: the guardrail hook must also work on Node 22, the default Node in Claude cloud
      # sessions and routines. A hook that crashes there lets tool calls through.
      - name: Set up Node 22 (Claude cloud sessions)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Guardrail hook works on Node 22
        run: bash scripts/claude-hooks/smoke.sh

      - name: Back to the project's Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          DEPLOYMENT_ID: ${{ github.sha }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra:
    # Spec 0002 D2: build and lint all Bicep without Azure credentials (extension types are pulled from mcr.microsoft.com).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bicep version
        run: bicep --version

      - name: Lint and build Bicep
        run: |
          set -euo pipefail
          for file in infra/bootstrap/main.bicep infra/main/main.bicep; do
            echo "::group::$file"
            bicep lint "$file"
            bicep build "$file" --stdout > /dev/null
            echo "::endgroup::"
          done
