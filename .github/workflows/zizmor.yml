name: zizmor

# Spec 0003 / ADR 0008: static analysis of GitHub Actions workflows and Dependabot config.
# Findings are uploaded to code scanning; the ruleset on main blocks merges with open findings.
# Weekly as well, because online audits (for example known-vulnerable actions) change over time.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Pinned, not "latest": the tool version moves only through a reviewed PR.
          version: 1.30.1
